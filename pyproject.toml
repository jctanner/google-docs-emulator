[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-docs-emulator"
version = "0.1.0"
description = "Offline Google Docs and supporting Drive API emulator"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "google-api-python-client>=2.150", "google-auth>=2.35", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
