name: Container
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GHCR (requires human approval through image-release environment)'
        type: boolean
        default: false
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t google-docs-emulator:smoke .
      - run: docker run --rm -i --network none --entrypoint python google-docs-emulator:smoke - < tests/container_smoke.py
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: smoke
    environment: image-release
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
