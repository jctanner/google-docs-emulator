name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --frozen --extra dev
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: git diff --exit-code -- src/google_docs_emulator/static/editor.js
      - run: npx playwright install --with-deps chromium
      - run: make lint
      - run: |
          export CHROMIUM_PATH="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          make test
        env:
          REQUIRE_NODE_CONTRACT: '1'
          REQUIRE_BROWSER_TEST: '1'
